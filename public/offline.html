<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#090a10" />
    <title>Offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #090a10; color: #eef0f7; font-family: system-ui, sans-serif; }
      .card { max-width: 520px; padding: 28px; border-radius: 24px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); text-align: center; }
      h1 { margin: 0 0 12px; font-size: clamp(2rem, 5vw, 2.6rem); }
      p { margin: 0; color: #b9bfd3; line-height: 1.6; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>QR Studio Pro</h1>
      <p>You are offline. The app is still available locally on this device, and your data remains protected in IndexedDB.</p>
    </div>
  </body>
</html>
