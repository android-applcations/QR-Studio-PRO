<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090a10" />
    <meta name="color-scheme" content="dark" />
    <title>Offline · QR Studio Pro</title>
    <style>
      :root {
        --bg: #090a10;
        --surface: #12141d;
        --line: rgba(255, 255, 255, 0.08);
        --fg: #eef0f7;
        --muted: #8f94a8;
        --brand: #7c6cff;
        --brand2: #22d3ee;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", Tahoma, Arial, sans-serif;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: 100%;
        max-width: 26rem;
        background: linear-gradient(160deg, var(--surface), var(--bg));
        border: 1px solid var(--line);
        border-radius: 1.25rem;
        padding: 1.75rem;
        text-align: center;
      }
      .logo {
        width: 4rem;
        height: 4rem;
        margin: 0 auto 1rem;
        border-radius: 1.15rem;
        background: linear-gradient(135deg, var(--brand), var(--brand2));
        display: grid;
        place-items: center;
        box-shadow: 0 12px 30px -14px var(--brand);
      }
      h1 { margin: 0 0 0.35rem; font-size: 1.25rem; font-weight: 800; letter-spacing: -0.01em; }
      h1 span { color: var(--brand); }
      p { margin: 0 0 0.6rem; color: var(--muted); font-size: 0.9rem; line-height: 1.7; }
      .ar { direction: rtl; }
      button {
        margin-top: 1rem;
        min-height: 2.75rem;
        padding: 0 1.25rem;
        border: 0;
        border-radius: 0.75rem;
        background: linear-gradient(135deg, var(--brand), var(--brand2));
        color: #fff;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
      }
      button:active { transform: scale(0.97); }
      .hint { margin-top: 1rem; font-size: 0.75rem; color: var(--muted); opacity: 0.8; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo" aria-hidden="true">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
          <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
          <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
          <path d="M14 14h3v3h-3zM20 20h1v1h-1zM17 20h1v1h-1zM20 17h1v1h-1z"></path>
        </svg>
      </div>
      <h1>QR Studio <span>Pro</span></h1>
      <p>You are offline. This page was saved on your device, so it still opens without a connection.</p>
      <p class="ar" lang="ar" dir="rtl">أنت غير متصل بالإنترنت. تم حفظ هذه الصفحة على جهازك، لذا تفتح بدون اتصال.</p>
      <button type="button" id="retry">Try again · إعادة المحاولة</button>
      <p class="hint">Your saved codes stay on this device. · تبقى رموزك المحفوظة على هذا الجهاز.</p>
    </main>
    <script>
      document.getElementById("retry").addEventListener("click", function () {
        window.location.reload();
      });
      window.addEventListener("online", function () {
        window.location.reload();
      });
    </script>
  </body>
</html>
